name: Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      # Дизайн-система подключена submodule-ом, и без неё сборка падает —
      # это и есть инвариант темы, а не досадная зависимость.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # Пересборка не должна давать диффа: theme.css коммитится, но не
      # правится руками. check-drift сам зовёт сборку.
      - run: make check
